<html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juan Gutiérrez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0b1030;
      --night-top: #1d2766;
      --night-deep: #05071a;
      --gold: #f4c95d;
      --gold-hover: #fae094;
      --cream: #fff4dc;
      --cream-muted: rgba(255, 244, 220, 0.68);
      --card-bg: rgba(11, 16, 48, 0.65);
      --border-gold: rgba(244, 201, 93, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--cream);
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, var(--night-top), var(--night) 55%, var(--night-deep)) fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Sutil brillo estelar en el fondo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image: 
        radial-gradient(1.5px 1.5px at 20% 30%, var(--gold), transparent),
        radial-gradient(1px 1px at 75% 20%, var(--cream), transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, var(--gold), transparent),
        radial-gradient(1px 1px at 30% 80%, var(--cream), transparent);
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-gold);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 
        0 25px 50px -12px rgba(5, 7, 26, 0.85),
        inset 0 1px 0 0 rgba(244, 201, 93, 0.18);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
      color: var(--cream);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      background-color: var(--gold);
      color: var(--night-deep);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.95rem 1.5rem;
      border-radius: 12px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 18px rgba(244, 201, 93, 0.22);
    }

    .btn-primary:hover {
      background-color: var(--gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(244, 201, 93, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
      margin: 2rem 0 1.5rem;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      background: rgba(255, 244, 220, 0.04);
      border: 1px solid rgba(244, 201, 93, 0.18);
      color: var(--cream-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      color: var(--gold);
      border-color: rgba(244, 201, 93, 0.45);
      background: rgba(244, 201, 93, 0.06);
      transform: translateY(-1px);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Juan Gutierrez</h1>
    
    <a href="https://www.linkedin.com/in/juan-guti%C3%A9rrez-cerd%C3%A1n/" target="_blank" rel="noopener noreferrer" class="btn-primary">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"></path>
      </svg>
      Contactar en LinkedIn
    </a>

    

    
  </main>


</body></html>
