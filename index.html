<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juan Gutiérrez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-navy: #060d1f;
      --card-navy: rgba(13, 27, 62, 0.72);
      --border-yellow: rgba(250, 204, 21, 0.22);
      --text-primary: #f8fafc;
      --accent-yellow: #facc15;
      --accent-yellow-hover: #fde047;
      --text-on-yellow: #060d1f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-navy);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.14) 0%, transparent 52%),
        radial-gradient(circle at 85% 85%, rgba(30, 58, 138, 0.4) 0%, transparent 48%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-navy);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-yellow);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 
        0 25px 50px -12px rgba(2, 6, 23, 0.75),
        inset 0 1px 0 0 rgba(250, 204, 21, 0.15);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      background-color: var(--accent-yellow);
      color: var(--text-on-yellow);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.9rem 1.75rem;
      border-radius: 12px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.28);
    }

    .btn-linkedin:hover {
      background-color: var(--accent-yellow-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(250, 204, 21, 0.42);
    }

    .btn-linkedin:active {
      transform: translateY(0);
    }

    .btn-linkedin svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Juan Gutierrez</h1>
    <a href="https://www.linkedin.com/in/juan-guti%C3%A9rrez-cerd%C3%A1n/" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn-linkedin">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
      </svg>
      Contactar en LinkedIn
    </a>
  </main>

</body>
</html>
